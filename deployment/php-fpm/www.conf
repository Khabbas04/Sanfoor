; ============================================================
; Sanfoor High-Performance PHP-FPM Pool Configuration
; ============================================================
; Replace: /etc/php/8.2/fpm/pool.d/www.conf
; After editing: sudo systemctl restart php8.2-fpm
; ============================================================

[www]
user = www-data
group = www-data

listen = /run/php/php8.2-fpm.sock
listen.owner = www-data
listen.group = www-data

; ── Process Manager: Dynamic (auto-scales workers) ──
pm = dynamic

; Maximum number of child processes (based on 2GB RAM droplet)
; Formula: (Total RAM - Reserved) / Avg PHP Process Size
; (2048MB - 512MB) / 40MB ≈ 38 → use 30 for safety
pm.max_children = 30

; Workers to start with
pm.start_servers = 5

; Minimum idle workers (ready to serve)
pm.min_spare_servers = 3

; Maximum idle workers
pm.max_spare_servers = 10

; Requests before recycling a worker (prevents memory leaks)
pm.max_requests = 500

; Timeout for a single request (2 minutes for AI endpoints)
request_terminate_timeout = 120s

; Slow log for debugging performance issues
slowlog = /var/log/php8.2-fpm-slow.log
request_slowlog_timeout = 5s

; ── OPcache Tuning (in php.ini) ──
; Ensure these are set in /etc/php/8.2/fpm/php.ini:
; opcache.enable=1
; opcache.memory_consumption=256
; opcache.max_accelerated_files=20000
; opcache.validate_timestamps=0  (ONLY in production!)
; opcache.jit=1255
; opcache.jit_buffer_size=128M
