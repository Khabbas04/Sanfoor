## ============================================================
## Sanfoor High-Performance Nginx Configuration
## ============================================================
## This replaces the default nginx config for sanfoor.me
## Includes: Gzip, Caching, Rate Limiting, Security Headers
## ============================================================

# Rate limiting zones (protects against DDoS & brute force)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=connlimit:10m;

server {
    server_name sanfoor.me www.sanfoor.me;

    root /var/www/sanfoor/public;
    index index.php index.html;

    # ── Connection Limits ──
    limit_conn connlimit 50;

    # ── Gzip Compression ──
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # ── Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Static Asset Caching (30 days) ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Build Assets (Vite - immutable, 1 year cache) ──
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Rate Limit: Login Endpoints ──
    location ~ ^/(login|register|forgot-password) {
        limit_req zone=login burst=10 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Rate Limit: API Endpoints ──
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Rate Limit: AI Advisor (expensive endpoint) ──
    location ~ ^/ai-advisor/chat {
        limit_req zone=login burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── General Routes ──
    location / {
        limit_req zone=general burst=30 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP Processing ──
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_buffering on;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 120s;
        fastcgi_read_timeout 120s;
    }

    # ── Block Hidden Files ──
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ── Block .env and sensitive files ──
    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
        return 404;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/sanfoor.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sanfoor.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.sanfoor.me) {
        return 301 https://$host$request_uri;
    }

    if ($host = sanfoor.me) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name sanfoor.me www.sanfoor.me;
    return 404;
}
